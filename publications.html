<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renyue Ji | Publications</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="index.html">Renyue Ji</a>
      </div>
      <div class="lang-switch">
        <button type="button" class="lang-btn" data-lang="en" aria-label="English">EN</button>
        <span class="lang-sep">|</span>
        <button type="button" class="lang-btn" data-lang="zh" aria-label="简体中文">中文</button>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="research.html" data-i18n="nav.research">Research</a>
        <a href="publications.html" class="active" data-i18n="nav.publications">Publications</a>
        <a href="insights.html" data-i18n="nav.insights">Insights</a>
        <a href="about.html" data-i18n="nav.about">About</a>
        <a href="data/JI%20RENYUE_CV.pdf" target="_blank">CV</a>
        <a href="https://www.researchgate.net/scientific-contributions/Renyue-Ji-2289470138" target="_blank" rel="noopener">ResearchGate</a>
      </nav>
      <div class="sidebar-footer">
        <a href="https://github.com/Renyueji/personal-website">GitHub</a>
      </div>
    </aside>

    <main class="main-content">
      <h1 class="page-title" data-i18n="publications.title">Publications</h1>
      <p class="page-subtitle"><span data-i18n="publications.subtitle">View my work on</span> <a href="https://www.researchgate.net/scientific-contributions/Renyue-Ji-2289470138" target="_blank" rel="noopener">ResearchGate</a>.</p>

      <section class="section">
        <div class="publications-list" id="publications-container">
          <p class="placeholder" data-i18n="publications.loading">Loading publications…</p>
        </div>
      </section>

      <footer class="site-footer">
        <p data-i18n="footer.copyright">© 2025 Renyue Ji</p>
      </footer>
    </main>
  </div>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
  <script>
    document.querySelectorAll('.lang-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { window.i18n && window.i18n.setLang(btn.getAttribute('data-lang')); });
    });
  </script>
</body>
</html>
